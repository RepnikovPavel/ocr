# Server deployment: vLLM plus the demo/agent API, as two services.
#
#   scripts/deploy_server.sh            # prepares and brings both up
#
# Two containers rather than one because they have different lifetimes: vLLM owns
# the GPU and takes ~40 s to become ready, while the demo restarts in a second and
# is the part that changes when code changes. Keeping them apart means deploying
# new code does not reload 6 GB of weights.
#
# Everything is parameterised through .env / the environment so one file serves
# a laptop and a server; scripts/deploy_server.sh writes the values it needs.

services:
  vllm:
    image: ${VLLM_IMAGE:-dots-mocr:vllm}
    container_name: ${VLLM_CONTAINER:-dots_vllm}
    restart: unless-stopped
    ipc: host
    # The checkpoint is served from a symlink shadow with auto_map restored:
    # scripts/prepare_checkpoint.py strips it for this repo's own loader, but
    # vLLM resolves the architecture through transformers and needs it.
    command:
      - /ckpt
      - --served-model-name=${VLLM_MODEL_NAME:-rednote-hilab/dots.mocr}
      - --gpu-memory-utilization=${VLLM_GPU_UTIL:-0.85}
      - --max-model-len=${VLLM_MAX_MODEL_LEN:-16384}
      - --chat-template-content-format=string
      - --trust-remote-code
      # sleep mode is what makes the demo's idle auto-unload actually return the
      # card; without it "unload" would free nothing (see demo/worker.py)
      - --enable-sleep-mode
      - --host=0.0.0.0
      - --port=8000
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HOME: /tmp/hf
      VLLM_SERVER_DEV_MODE: "1"        # registers /sleep and /wake_up
    # Published explicitly: the demo runs on host networking, so without this it
    # cannot reach the container at all — and on a busy host 127.0.0.1:8000 may
    # already answer for something else, which reads as a confusing 404 rather
    # than a connection refused.
    ports:
      - "127.0.0.1:${VLLM_PORT:-8000}:8000"
    volumes:
      - ${VLLM_CKPT_SHADOW:?set by deploy_server.sh}:/ckpt:ro
      - /mnt:/mnt:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${VLLM_GPU:-0}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s

  # Second model, hot on its own GPU. dots.mocr (dots_ocr + auto_map) only
  # loads on the older vLLM the `vllm` service pins, while GLM-OCR (native
  # glm_ocr in transformers 5.x) needs a current vLLM build — so they cannot
  # share one server. On a 2x4090 host each model gets a card, the demo's model
  # selector repoints the worker between them, and switching is instant (no
  # weight reload). Gated by DEMO_DUAL=1: unset, the whole service is skipped
  # and a single-model deploy is unchanged.
  glm_vllm:
    # vLLM 0.25.1 + transformers 5.13.1 on a CUDA-12.4 base. The official
    # vllm/vllm-openai cu129/13 tags are refused by this host's
    # nvidia-container-toolkit (legacy mode, cuda>=12.9 unsatisfied), but a
    # CUDA-12.4 image runs fine on the same driver. This image is the one
    # already present on the server; override with GLM_VLLM_IMAGE if needed.
    image: ${GLM_VLLM_IMAGE:-qwen3-vllm:cu124}
    container_name: ${GLM_VLLM_CONTAINER:-glm_vllm}
    restart: unless-stopped
    ipc: host
    profiles: ["dual"]
    # qwen3-vllm:cu124 has no vLLM entrypoint baked in, so invoke the server
    # module explicitly. NOTE: the api_server module takes --model <path>, not
    # a positional model arg (only the `vllm serve` CLI does) — a positional
    # path here is silently ignored and vLLM falls back to a repo download.
    entrypoint: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
    command:
      # Path inside the container to the snapshot (the cache root is at /hf).
      - --model=${GLM_CKPT:-/hf/models--zai-org--GLM-OCR/snapshots/main}
      - --served-model-name=${GLM_MODEL_NAME:-glm-ocr}
      - --gpu-memory-utilization=${GLM_GPU_UTIL:-0.85}
      - --max-model-len=${GLM_MAX_MODEL_LEN:-32768}
      # MTP speculative decode (model card) speeds up autoregression; cheap to
      # try, compared in reports/ after the run.
      - --speculative-config=${GLM_SPEC_CONFIG:-{"method":"mtp","num_speculative_tokens":3}}
      - --enable-sleep-mode
      - --host=0.0.0.0
      - --port=8000
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HOME: /tmp/hf
      VLLM_SERVER_DEV_MODE: "1"
    ports:
      - "127.0.0.1:${GLM_VLLM_PORT:-8001}:8000"
    volumes:
      # Mount the WHOLE HF cache root, not just the snapshot dir: the snapshot
      # holds symlinks into ../../blobs/, so mounting only snapshots/ leaves
      # config.json and model.safetensors as broken links and vLLM falls back
      # to a (offline-disabled) snapshot_download that then fails.
      - ${GLM_CKPT_DIR:?set by deploy_dual.sh}:/hf:ro
      - /mnt:/mnt:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GLM_VLLM_GPU:-1}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s

  demo:
    image: ${DOTS_MOCR_IMAGE:-dots-mocr:trtllm-1.3.0rc20}
    container_name: ${DEMO_CONTAINER:-dots_mocr_demo}
    restart: unless-stopped
    init: true
    # The demo holds no weights under this engine, so it needs no GPU at all —
    # only a route to vLLM. That is also why it restarts instantly.
    network_mode: host
    command: ["python3", "-m", "demo.server"]
    working_dir: /opt/dots-mocr
    environment:
      CKPTDIR: /models
      DEMO_STATE_DIR: /state
      DEMO_ENGINE: vllm
      DEMO_VLLM_URL: http://127.0.0.1:${VLLM_PORT:-8000}/v1
      DEMO_VLLM_MODEL: ${VLLM_MODEL_NAME:-rednote-hilab/dots.mocr}
      DEMO_IDLE_UNLOAD_S: ${DEMO_IDLE_UNLOAD_S:-180}
      # Name of the vLLM container the worker stops on idle-unload to free ALL
      # VRAM (sleep-mode alone leaves ~700 MiB of CUDA context resident).
      # See demo/worker.py:_stop_vllm_container. Requires the docker.sock mount below.
      DEMO_VLLM_CONTAINER: ${VLLM_CONTAINER:-dots_vllm}
      # Model selector: with DEMO_DUAL=1 the glm_vllm service is up and the
      # demo exposes a dropdown to switch between dots.mocr (GPU0) and GLM-OCR
      # (GPU1). The *_DOTS vars let dots.mocr's endpoint be named explicitly
      # alongside the GLM ones instead of relying on the single-model fallbacks
      # in demo/models.py.
      DEMO_MODEL_SELECTOR: ${DEMO_MODEL_SELECTOR:-0}
      DEMO_MODEL: ${DEMO_MODEL:-dots_mocr}
      DEMO_VLLM_URL_DOTS: http://127.0.0.1:${VLLM_PORT:-8000}/v1
      DEMO_VLLM_MODEL_DOTS: ${VLLM_MODEL_NAME:-rednote-hilab/dots.mocr}
      DEMO_VLLM_CONTAINER_DOTS: ${VLLM_CONTAINER:-dots_vllm}
      DEMO_VLLM_URL_GLM: http://127.0.0.1:${GLM_VLLM_PORT:-8001}/v1
      DEMO_VLLM_MODEL_GLM: ${GLM_MODEL_NAME:-glm-ocr}
      DEMO_VLLM_CONTAINER_GLM: ${GLM_VLLM_CONTAINER:-glm_vllm}
      PORT: ${DEMO_PORT:-8601}
      DEMO_HOST: ${DEMO_HOST:-127.0.0.1}
      DOTS_MOCR_WEB_PORT: ${DEMO_PORT:-8601}
      # src FIRST: the image carries a copy of dots_mocr in dist-packages that is
      # older than this checkout (it inlines pictures as base64). Putting src at
      # the front of PYTHONPATH makes `import dots_mocr` resolve to the mounted
      # code, so the bundle ships pictures as image files + relative links.
      PYTHONPATH: /opt/dots-mocr/src:/opt/dots-mocr
      HOME: /tmp
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      # the checkout, so deploying new code does not mean rebuilding a 60 GB image
      - ${REPO_ROOT:?set by deploy_server.sh}:/opt/dots-mocr:ro
      - ${CKPT_DIR:?set by deploy_server.sh}:/models:ro
      - ${STATE_DIR:?set by deploy_server.sh}:/state
      # Docker Engine socket: the worker stops the vLLM container on idle-unload
      # to free ALL VRAM (not just the weights). Without this mount the stop call
      # is a silent no-op and ~700 MiB of CUDA context stays resident on the GPU.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      vllm:
        condition: service_healthy
      # GLM-OCR vLLM — only waited on under the `dual` profile (DEMO_DUAL=1).
      glm_vllm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:${DEMO_PORT:-8601}/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
